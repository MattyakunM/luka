<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><title>Luka Web</title><link rel="stylesheet" href="/style.css"></head><body>
<header class="top"><div class="brand">● Luka</div><div id="account"></div></header><main>
<section id="auth" class="card auth"><h1>Luka Web</h1><p>つながるためのLuka。</p><div><button class="tab active" data-mode="login">ログイン</button><button class="tab" data-mode="register">新規登録</button></div><form id="authForm"><input id="username" placeholder="ユーザー名" required><input id="password" type="password" placeholder="パスワード（8文字以上）" required><button class="primary" id="authSubmit">ログイン</button></form><p id="authMsg"></p></section>
<section id="app" class="layout hidden"><aside class="card side"><div class="nav"><button data-page="home" class="navbtn active">🏠 ホーム</button><button data-page="dm" class="navbtn">💬 DM <span id="dmCount"></span></button><button data-page="friends" class="navbtn">🤝 フレンド</button><button data-page="notifications" class="navbtn">🔔 通知 <span id="notCount"></span></button><button data-page="profile" class="navbtn">👤 プロフィール</button></div><hr><h3>スペース</h3><div id="spaces"></div><button id="newSpace" class="secondary">＋ スペース</button></aside>
<section class="card work"><header><div><b id="title">ホーム</b><div id="subtitle" class="muted"></div></div><span id="badge"></span></header><div id="page" class="page"></div></section></section></main>
<script src="/socket.io/socket.io.js"></script><script src="/app.js"></script></body></html>
