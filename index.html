<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Luka</title><link rel="stylesheet" href="/style.css"><script src="/socket.io/socket.io.js"></script></head><body>

<script src="/app.js"></script></body></html>
