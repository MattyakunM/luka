<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><title>Luka Web</title><link rel="stylesheet" href="/style.css"></head><body>
<header class="top"><b>● Luka</b><span id="account"></span></header><main>
<section id="auth" class="card auth"><h1>Luka Web</h1><p>今までのLukaをWebサービスとして育てていこう。</p><div><button class="tab active" data-mode="login">ログイン</button><button class="tab" data-mode="register">新規登録</button></div><form id="authForm"><input id="username" placeholder="ユーザー名" required><input id="password" type="password" placeholder="パスワード（8文字以上）" required><button class="primary" id="authSubmit">ログイン</button></form><p id="authMsg"></p></section>
<section id="app" class="layout hidden"><aside class="card side"><h3>スペース</h3><div id="spaces"></div><button id="newSpace" class="secondary">＋ スペース</button></aside><section class="card work"><header><b id="spaceName">ホーム</b><span id="roomName">部屋を選択</span><span id="badge"></span></header><nav id="rooms"></nav><div id="messages"><div class="empty">Luka Webへようこそ！</div></div><form id="messageForm"><input id="messageInput" maxlength="4000" placeholder="メッセージを入力…"><button class="primary">送信</button></form></section></section></main>
<script src="/socket.io/socket.io.js"></script><script src="/app.js"></script></body></html>
